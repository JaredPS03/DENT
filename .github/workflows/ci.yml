name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Actions are pinned to full commit SHAs (version in the comment): a moved tag cannot change
# what runs here. The checkout never keeps the GitHub token on disk.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  database-and-backend:
    name: Base de datos y backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar la CLI de Supabase (fijada en package.json)
        run: pnpm install --frozen-lockfile

      - name: Levantar la base local y Storage (sin los servicios que las pruebas no usan)
        run: pnpm supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,postgrest
      - name: supabase db reset (migraciones y seed desde cero)
        run: pnpm db:reset
      - name: supabase test db (pgTAP)
        run: pnpm db:test

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias del backend
        working-directory: backend
        run: uv sync --locked
      - name: Ruff
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        working-directory: backend
        run: uv run mypy app tests
      - name: Pytest (unitarias e integración contra la base local)
        working-directory: backend
        run: uv run pytest
      - name: Dependencias vulnerables (pip-audit)
        working-directory: backend
        run: |
          uv export --format requirements-txt --locked --no-emit-project --quiet -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  panel:
    name: Panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter panel lint
      - name: Typecheck
        run: pnpm --filter panel typecheck
      - name: Build
        run: pnpm --filter panel build
      - name: Dependencias vulnerables (las que se despliegan)
        run: pnpm audit --prod --audit-level high

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks verificando su checksum
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sed "s/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz/gitleaks.tar.gz/" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Escanear todo el historial
        run: $RUNNER_TEMP/gitleaks git . --redact --no-banner
